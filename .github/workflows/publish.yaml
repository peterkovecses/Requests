name: Publish to NuGet

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Pack
      run: dotnet pack src/Kovecses.Requests/Kovecses.Requests.csproj -c Release -o out

    - name: NuGet Login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(grep '<Version>' src/Kovecses.Requests/Kovecses.Requests.csproj | sed -E 's/.*<Version>(.*)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Extract Release Notes Section
      run: |
        sed '/^---/q' RELEASE_NOTES.md | sed '/^---/d' > RELEASE_NOTES_TEMP.md

    - name: Check Existing GitHub Release
      id: release_check
      uses: actions/github-script@v7
      env:
        RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
      with:
        script: |
          try {
            await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: `v${process.env.RELEASE_VERSION}`,
            });
            core.setOutput('exists', 'true');
            core.info(`Release v${process.env.RELEASE_VERSION} already exists; leaving it unchanged.`);
          } catch (error) {
            if (error.status !== 404) throw error;
            core.setOutput('exists', 'false');
          }

    - name: Create GitHub Release
      if: steps.release_check.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        body_path: RELEASE_NOTES_TEMP.md
        files: out/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
